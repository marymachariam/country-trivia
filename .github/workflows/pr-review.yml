name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Configure OpenCode
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json << 'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "openai": {
                "apiKey": "${{ secrets.OPENCODE_API_KEY }}"
              }
            }
          }
          EOF

      - name: Get PR diff
        id: pr-diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr-diff.txt
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/pr-diff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run OpenCode PR Review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          PROMPT="You are reviewing PR #${PR_NUMBER} titled '${PR_TITLE}' by @${PR_AUTHOR}.

          PR Description:
          ${PR_BODY}

          Please review the following diff and provide:
          1. A summary of changes
          2. Potential bugs or issues
          3. Code quality feedback
          4. Suggestions for improvement
          5. Security concerns if any

          Be concise and actionable. Focus on the most important issues.

          Diff:
          $(cat /tmp/pr-diff.txt)"

          opencode run "$PROMPT" --model gpt-4o > /tmp/review-output.txt 2>&1 || true

          cat /tmp/review-output.txt

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review-output.txt', 'utf8');

            const body = `## OpenCode PR Review

            ${review}

            ---
            *This review was automatically generated by [OpenCode](https://opencode.ai)*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
